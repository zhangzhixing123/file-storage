// ================================================================
// 🚀 获取存储桶所有文件（支持分页）
// ================================================================
async function getAllStorageFiles() {
    let allFiles = [];
    let offset = 0;
    let hasMore = true;
    
    while (hasMore) {
        const { data, error } = await sb.storage.from("files").list("", {
            limit: PAGE_LIMIT,
            offset: offset
        });
        
        if (error) {
            throw error;
        }
        
        if (!data || data.length === 0) {
            hasMore = false;
        } else {
            allFiles = allFiles.concat(data);
            offset += data.length;
            if (data.length < PAGE_LIMIT) {
                hasMore = false;
            }
            console.log(`📂 已获取 ${allFiles.length} 个文件...`);
        }
    }
    
    console.log(`📂 共获取 ${allFiles.length} 个文件`);
    return allFiles;
}

function showResult(msg, type = 'info') {
    const box = document.getElementById('cleanResult');
    const cls = type === 'error' ? 'result-box error' : type === 'warn' ? 'result-box warn' : type === 'success' ? 'result-box success' : 'result-box info';
    box.innerHTML = `<div class="${cls}">${msg}</div>`;
}

// ================================================================
// 📊 检查容量并自动清理
// ================================================================
async function checkAndAutoClean() {
    try {
        const storageFiles = await getAllStorageFiles();
        let totalBytes = 0;
        storageFiles.forEach(f => totalBytes += f.metadata?.size || 0);
        
        const totalBytesLimit = totalStorageGB * 1024 * 1024 * 1024;
        const usagePercent = totalBytesLimit > 0 ? (totalBytes / totalBytesLimit * 100) : 0;
        
        console.log(`📊 存储使用率: ${usagePercent.toFixed(2)}%`);
        
        // 如果使用率超过阈值，触发自动清理
        if (usagePercent >= CAPACITY_THRESHOLD) {
            console.log(`⚠️ 存储使用率 ${usagePercent.toFixed(2)}% 超过阈值 ${CAPACITY_THRESHOLD}%，触发自动清理`);
            
            // 显示警告
            const statusDiv = document.getElementById('capacityStatus');
            statusDiv.innerHTML = `<div class="capacity-danger">⚠️ 存储使用率 ${usagePercent.toFixed(2)}%，已超过 ${CAPACITY_THRESHOLD}% 阈值，正在自动清理旧文件...</div>`;
            
            // 执行自动清理
            await autoCleanOldFiles(storageFiles);
            
            // 重新加载显示
            await loadAllFiles();
            return true;
        } else if (usagePercent >= 80) {
            // 显示预警
            const statusDiv = document.getElementById('capacityStatus');
            statusDiv.innerHTML = `<div class="capacity-warning">⚠️ 存储使用率 ${usagePercent.toFixed(2)}%，接近容量上限，建议清理旧文件</div>`;
        } else {
            document.getElementById('capacityStatus').innerHTML = '';
        }
        
        return false;
    } catch(err) {
        console.error('容量检查失败:', err);
        return false;
    }
}

// ================================================================
// 🗑️ 自动清理旧文件（按时间排序，删除最旧的文件）
// ================================================================
async function autoCleanOldFiles(storageFiles) {
    if (!storageFiles || storageFiles.length === 0) {
        console.log('📭 存储桶中没有文件，无需清理');
        return;
    }
    
    // 按创建时间排序（旧的在前）
    const sorted = [...storageFiles].sort((a, b) => {
        const ta = a.created_at || a.updated_at || '';
        const tb = b.created_at || b.updated_at || '';
        return new Date(ta) - new Date(tb);
    });
    
    // 计算需要删除的数量（删除10%最旧的文件）
    const delCount = Math.max(1, Math.ceil(sorted.length * 0.1));
    const delList = sorted.slice(0, delCount).map(f => f.name);
    
    console.log(`🗑️ 自动清理 ${delCount} 个最旧的文件:`, delList);
    
    try {
        // 分批删除存储文件
        const batchSize = 50;
        let successCount = 0;
        
        for(let i = 0; i < delList.length; i += batchSize) {
            const batch = delList.slice(i, i + batchSize);
            try {
                await sb.storage.from("files").remove(batch);
                successCount += batch.length;
                console.log(`✅ 已删除 ${successCount}/${delList.length} 个文件`);
            } catch(err) {
                console.error(`批量删除失败:`, err);
                // 逐个重试
                for(const fileName of batch) {
                    try {
                        await sb.storage.from("files").remove([fileName]);
                        successCount++;
                    } catch(e) {
                        console.error(`删除失败: ${fileName}`, e);
                    }
                }
            }
        }
        
        // 清理数据库记录
        try {
            await sb.from('file_notes').delete().in('file_name', delList);
            console.log(`✅ 已清理 ${delList.length} 条数据库记录`);
        } catch(err) {
            console.warn('数据库记录清理失败:', err);
        }
        
        alert(`🔄 存储使用率超过 ${CAPACITY_THRESHOLD}%，已自动删除 ${successCount} 个最旧的文件释放空间`);
        
    } catch(err) {
        console.error('自动清理失败:', err);
    }
}

window.copySingleFileName = async function(storeName){
    try {
        const realName = getDisplayFileName(storeName);
        let pure = getPureFileName(realName);
        await navigator.clipboard.writeText(pure);
        alert("复制成功：" + pure);
    }catch(e){ alert("复制失败，请重试"); }
}

window.copySelectedFileNames = async function(){
    let arr = Array.from(document.querySelectorAll(".file-chk:checked")).map(x => x.value);
    if(arr.length === 0){ alert("请先勾选文件"); return; }
    let text = arr.map(storeName=>{
        const realName = getDisplayFileName(storeName);
        return getPureFileName(realName);
    }).join(",");
    try {
        await navigator.clipboard.writeText(text);
        alert("批量复制成功！\n" + text);
    }catch(e){ alert("复制失败，请重试"); }
}

function initApp() {

    setDelText();

    document.getElementById('pageSizeSelect').addEventListener('change',function(){

        localStorage.setItem('pageSize', pageSize);
        currentPage = 1; renderFiles();
    });

    document.querySelectorAll('.user-filter-chk').forEach(chk=>{
        chk.addEventListener('change', function(){
            selectedUserFilters = Array.from(document.querySelectorAll('.user-filter-chk:checked')).map(c=>c.value);
            currentPage = 1; renderFiles();
        });
    });

    window.clearUserFilter = function(){
        document.querySelectorAll('.user-filter-chk').forEach(c=>c.checked=false);
        selectedUserFilters = []; currentPage=1; renderFiles();
    }

    document.getElementById('dateStart').addEventListener('change', function(){
        dateStart = this.value;
        currentPage = 1; renderFiles();
    });
    document.getElementById('dateEnd').addEventListener('change', function(){
        dateEnd = this.value;
        currentPage = 1; renderFiles();
    });

    window.clearDateFilter = function(){
        document.getElementById('dateStart').value = '';
        document.getElementById('dateEnd').value = '';
        dateStart = '';
        dateEnd = '';
        currentPage = 1; renderFiles();
    }

    loadAllFiles();
    startAutoRefresh();

window.runAutoDelete = async function(){
    let day = parseInt(document.getElementById('delDaySelect').value);
    if(day === 0){ alert("请选择清理周期（如7天、15天、30天等）"); return; }
    
    try {
        const bucketAll = await getAllStorageFiles();
        if(!bucketAll || bucketAll.length === 0) {
            alert("存储桶中没有文件");
            return;
        }
        
        const cutoffDate = getBeforeDayStr(day);
        console.log(`📅 截止日期: ${cutoffDate}，将删除 ${day} 天前的文件`);
        
        const expiredFiles = [];
        const keptFiles = [];
        
        for(const file of bucketAll) {
            const fileTime = file.created_at || file.updated_at || '';
            const dayStr = fileTime.split('T')[0];
            if(dayStr < cutoffDate) {
                expiredFiles.push(file.name);
            } else {
                keptFiles.push(file.name);
            }
        }
        
        console.log(`📂 存储桶总文件数: ${bucketAll.length}`);
        console.log(`🗑️ 过期文件数: ${expiredFiles.length}`);
        
        if(expiredFiles.length === 0) {
            alert(`没有 ${day} 天前的过期文件需要清理`);
            return;
        }
        
        if(!confirm(`将删除 ${expiredFiles.length} 个 ${day} 天前的过期文件，确认？`)) {
            return;
        }
        
        const batchSize = 50;
        let successCount = 0;
        let failCount = 0;
        const failList = [];
        
        for(let i = 0; i < expiredFiles.length; i += batchSize) {
            const batch = expiredFiles.slice(i, i + batchSize);
            console.log(`🔄 删除第 ${Math.floor(i/batchSize)+1} 批，${batch.length} 个文件...`);
            
            try {
                const { error: delErr } = await sb.storage.from("files").remove(batch);
                if(delErr) {
                    for(const fileName of batch) {
                        try {
                            await sb.storage.from("files").remove([fileName]);
                            successCount++;
                        } catch(e) {
                            failCount++;
                            failList.push(fileName);
                            console.error(`删除失败: ${fileName}`, e);
                        }
                    }
                } else {
                    successCount += batch.length;
                }
            } catch(err) {
                for(const fileName of batch) {
                    try {
                        await sb.storage.from("files").remove([fileName]);
                        successCount++;
                    } catch(e) {
                        failCount++;
                        failList.push(fileName);
                        console.error(`删除失败: ${fileName}`, e);
                    }
                }
            }
        }
        
        if(successCount > 0) {
            try {
                const deletedFiles = expiredFiles.filter(f => !failList.includes(f));
                if(deletedFiles.length > 0) {
                    await sb.from('file_notes').delete().in('file_name', deletedFiles);
                    console.log(`✅ 已清理 ${deletedFiles.length} 条数据库记录`);
                }
            } catch(err) {
                console.warn('数据库清理失败:', err);
            }
        }
        
        let result = `🧹 自动清理完成！\n\n`;
        result += `📅 清理 ${day} 天前的文件\n`;
        result += `📂 总文件数：${bucketAll.length}\n`;
        result += `✅ 成功删除：${successCount} 个过期文件\n`;
        result += `❌ 删除失败：${failCount} 个文件\n`;
        result += `📊 保留：${keptFiles.length} 个文件\n`;
        if(failList.length > 0) {
            result += `\n失败文件列表（前20个）：\n${failList.slice(0, 20).join("\n")}`;
        }
        
        alert(result);
        await loadAllFiles();
        
    } catch(err) {
        console.error('自动清理失败:', err);
        alert(`自动清理失败：${err.message}`);
    }
}

function updateTotalSpace(totalBytes){
    let total = totalStorageGB * 1024*1024*1024;
    let pct = total > 0 ? (totalBytes / total * 100) : 0;
    let used = (totalBytes / 1024 / 1024).toFixed(2);
    let max = (totalStorageGB * 1024).toFixed(2);
    document.getElementById('storageProgress').style.width = Math.min(pct, 100)+'%';
    document.getElementById('storageText').innerText = `总大小：${used} MB / 容量：${max} MB  占用：${pct.toFixed(2)}%`;
    
    // 检查是否需要显示警告
    if(pct >= CAPACITY_THRESHOLD) {
        document.getElementById('capacityStatus').innerHTML = 
            `<div class="capacity-danger">⚠️ 存储使用率 ${pct.toFixed(2)}%，已超过 ${CAPACITY_THRESHOLD}% 阈值，系统将自动清理旧文件</div>`;
    } else if(pct >= 80) {
        document.getElementById('capacityStatus').innerHTML = 
            `<div class="capacity-warning">⚠️ 存储使用率 ${pct.toFixed(2)}%，接近容量上限，建议清理旧文件</div>`;
    } else {
        document.getElementById('capacityStatus').innerHTML = '';
    }
}

window.loadAllFiles = async function(isSilent = false){
    try {
        const storageFiles = await getAllStorageFiles();
        allFiles = storageFiles || [];
        
        allFiles.sort((a, b) => {
            let ta = a.created_at || a.updated_at || '';
            let tb = b.created_at || b.updated_at || '';
            return new Date(tb) - new Date(ta);
        });

        let total = 0;
        allFiles.forEach(i => total += i.metadata?.size || 0);
        updateTotalSpace(total);
        await loadAllNotes();
        
        document.getElementById('totalCountText').innerText = `存储桶总文件数：${allFiles.length} 个`;
        
        renderFiles();

document.getElementById("fileInput").onchange = async e => {
    const fs = e.target.files;
    const illegalChars = /[\\\/:*?"<>|\t\n\r\0-\x1F]/g;
    const existNames = allFiles.map(item => item.name);

    let successCount = 0;
    let failMsg = "";

    for (const f of fs) {
        const originFileName = f.name;
        let safeName = originFileName.replace(illegalChars, '');
        if (!safeName) safeName = `未命名_${Date.now()}`;

        const randomPrefix = Date.now() + "_";
        let storageFileName = randomPrefix + safeName;

        let repeatNum = 1;
        while (existNames.includes(storageFileName)) {
            const dotIndex = storageFileName.lastIndexOf('.');
            if (dotIndex > 0) {
                const namePart = storageFileName.slice(0, dotIndex);
                const extPart = storageFileName.slice(dotIndex);
                storageFileName = `${namePart}_${repeatNum}${extPart}`;
            } else {
                storageFileName = `${storageFileName}_${repeatNum}`;
            }
            repeatNum++;
        }
        existNames.push(storageFileName);

        try {
            const { error } = await sb.storage.from("files").upload(storageFileName, f);
            if (error) throw error;
            await sb.from('file_notes').upsert([{
                file_name: storageFileName,
                uploader: currentLoginUser,
                note: "",
                origin_name: originFileName
            }]);
            successCount++;
        } catch (err) {
            console.error(`文件【${originFileName}】上传失败：`, err);
            failMsg += `文件：${originFileName}\n错误：${err.message}\n\n`;
        }
    }

    if (failMsg) {
        alert(`上传完成，成功${successCount}个，失败${fs.length - successCount}个\n失败明细：\n${failMsg}`);
    } else {
        alert(`全部上传成功，共${successCount}个文件`);
    }

    e.target.value = "";
    currentPage = 1;
    await loadAllFiles();
    // 上传后检查容量
    await checkAndAutoClean();
};

window.showAllFiles = async function() {
    showResult('⏳ 正在获取数据...', 'info');
    
    try {
        const storageFiles = await getAllStorageFiles();
        if(!storageFiles || storageFiles.length === 0) {
            showResult('📭 存储桶中没有文件', 'warn');
            return;
        }
        
        const { data: noteRecords } = await sb.from("file_notes").select("file_name, origin_name");
        const dbFileNames = new Set();
        if(noteRecords) {
            noteRecords.forEach(item => {
                if(item.file_name) dbFileNames.add(item.file_name);
            });
        }
        
        const inBoth = [];
        const onlyInStorage = [];
        const onlyInDB = [];
        
        for(const file of storageFiles) {
            if(dbFileNames.has(file.name)) {
                inBoth.push(file.name);
            } else {
                onlyInStorage.push(file.name);
            }
        }
        
        for(const fileName of dbFileNames) {
            const exists = storageFiles.some(f => f.name === fileName);
            if(!exists) {
                onlyInDB.push(fileName);
            }

        let msg = `📊 数据对比结果\n\n`;
        msg += `📂 存储桶文件总数：${storageFiles.length}\n`;
        msg += `📄 数据库记录总数：${dbFileNames.size}\n\n`;
        msg += `✅ 两者都有：${inBoth.length} 个\n`;
        msg += `🗑️ 仅存储桶有（应删除）：${onlyInStorage.length} 个\n`;
        msg += `🔧 仅数据库有（应清理）：${onlyInDB.length} 个\n\n`;
        
        if(onlyInStorage.length > 0) {
            msg += `📋 仅存储桶有的文件（前50个）：\n`;
            const showCount = Math.min(onlyInStorage.length, 50);
            for(let i = 0; i < showCount; i++) {

            }
            if(onlyInStorage.length > 50) {
                msg += `  ... 共 ${onlyInStorage.length} 个文件\n`;
            }
        }
        
        if(onlyInDB.length > 0) {
            msg += `\n📋 仅数据库有的记录（前20个）：\n`;
            const showCount = Math.min(onlyInDB.length, 20);
            for(let i = 0; i < showCount; i++) {
                msg += `  ${i+1}. ${onlyInDB[i]}\n`;
            }
            if(onlyInDB.length > 20) {
                msg += `  ... 共 ${onlyInDB.length} 条记录\n`;
            }
        }
        
        if(onlyInStorage.length === 0 && onlyInDB.length === 0) {
            msg += `\n✅ 数据完全一致，无需清理`;
        }
        
        showResult(msg, onlyInStorage.length > 0 ? 'warn' : 'success');
        
        console.log('=== 数据对比结果 ===');
        console.log('存储桶文件数:', storageFiles.length);
        console.log('数据库记录数:', dbFileNames.size);
        console.log('两者都有:', inBoth.length);
        console.log('仅存储桶有:', onlyInStorage);
        console.log('仅数据库有:', onlyInDB);
        
    } catch(err) {
        console.error('获取失败:', err);
        showResult(`❌ 获取失败：${err.message}`, 'error');
    }

window.delOne = async storeName => {
    if(!confirm("确定删除该文件？")) return;
    
    try {
        await sb.storage.from("files").remove([storeName]);
    } catch (err) {
        alert(`存储删除失败：${err.message}`);
        loadAllFiles();
        return;
    }
    
    try {
        await sb.from('file_notes').delete().eq('file_name', storeName);
    } catch (err) {
        alert(`存储已删除，但数据库清理失败：${err.message}`);
    }
    
    alert("删除完成");
    loadAllFiles();
}

document.getElementById("batchDelete").onclick = async () => {
    let arr = Array.from(document.querySelectorAll(".file-chk:checked")).map(x => x.value);
    if(arr.length === 0){ alert("请先勾选文件"); return; }
    if(!confirm(`确定删除 ${arr.length} 个文件？`)) return;
    
    const allBucketFiles = await getAllStorageFiles();
    const existFileSet = new Set(allBucketFiles.map(item => item.name));
    
    const realDelFiles = arr.filter(name => existFileSet.has(name));
    const orphanNotes = arr.filter(name => !existFileSet.has(name));
    
    if(orphanNotes.length > 0){
        if(confirm(`检测到 ${orphanNotes.length} 个文件仅数据库有记录，是否清理？`)){
            try{
                await sb.from('file_notes').delete().in('file_name', orphanNotes);
                alert(`已清理 ${orphanNotes.length} 条残留`);
            }catch(e){
                alert(`清理残留失败：${e.message}`);
            }
        }
    }
    
    if(realDelFiles.length === 0){
        alert("无文件需要删除");
        loadAllFiles();
        return;
    }
    
    try {
        await sb.storage.from("files").remove(realDelFiles);
    } catch (err) {
        alert(`删除失败：${err.message}`);
        loadAllFiles();
        return;
    }
    
    try {
        await sb.from('file_notes').delete().in('file_name', realDelFiles);
    } catch (err) {
        alert(`存储已删除，但数据库清理失败`);
    }
    
    alert(`删除完成，共 ${realDelFiles.length} 个文件`);
    loadAllFiles();
}

document.getElementById("batchDownload").onclick = async () => {
    let arr = Array.from(document.querySelectorAll(".file-chk:checked")).map(x => x.value);
    if(arr.length === 0){ alert("请先勾选文件"); return; }

    try {
        if (typeof JSZip === 'undefined') {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        const zip = new JSZip();
        const promises = [];

        for (const storeName of arr) {
            const url = sb.storage.from("files").getPublicUrl(storeName).data.publicUrl;
            const encodedUrl = encodeURI(url);
            const showName = getDisplayFileName(storeName);
            const promise = fetch(encodedUrl)
                .then(res => res.blob())
                .then(blob => zip.file(showName, blob, { binary: true }));
            promises.push(promise);
        }

        await Promise.all(promises);
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        const date = new Date().toLocaleString().replace(/[/:, ]/g, '-');
        link.download = `文件批量下载_${date}.zip`;
        link.click();
        alert(`批量下载完成，共${arr.length}个文件`);
    } catch (err) {
        console.error('批量下载失败', err);
        alert('批量下载失败：' + err.message);
    }
};

function renderPagination(){
    const total = filteredFiles.length;
    const totalPages = Math.ceil(total / pageSize) || 1;
    const pager = document.getElementById('pageBtns');
    const info = document.getElementById('pageInfo');
    let html = '';
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>上一页</button>`;
    let startPage = Math.max(1, currentPage - 5);
    let endPage = Math.min(totalPages, currentPage + 4);
    for(let i=startPage; i<=endPage; i++){
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>下一页</button>`;
    pager.innerHTML = html;
    info.innerText = `第 ${currentPage} / ${totalPages} 页，共 ${total} 条`;
}

window.goPage = function(page){
    const totalPages = Math.ceil(filteredFiles.length / pageSize) || 1;
    if(page < 1 || page > totalPages) return;
    currentPage = page; renderFiles();
}

function renderFiles(){
    let searchMode = document.getElementById("searchType").value;
    let nameKeys = parseMultiKeywords(searchTxt);
    let noteKeys = parseMultiKeywords(noteSearchTxt);

    function matchBaseFilter(f){
        const storeName = f.name;
        const meta = getFileMeta(storeName);
        const realFileName = getDisplayFileName(storeName);
        const displayLower = realFileName.toLowerCase();
        const uploader = (meta.uploader || "").trim();
        const pureNoteText = meta.note.toLowerCase();

        let nameOk = true;
        let noteOk = true;
        let userOk = true;

        if(nameKeys.length > 0){
            if(searchMode === 'fuzzy'){
                nameOk = nameKeys.some(k => displayLower.includes(k));
            }else{
                nameOk = nameKeys.some(k => displayLower === k);
            }
        }
        if(noteKeys.length > 0){
            if(searchMode === 'fuzzy'){
                noteOk = noteKeys.some(k => pureNoteText.includes(k));
            }else{
                noteOk = noteKeys.some(k => pureNoteText === k);
            }
        }
        if(selectedUserFilters.length > 0){
            const cleanFilterUsers = selectedUserFilters.map(u => u.trim());
            userOk = cleanFilterUsers.includes(uploader);
        }
        return nameOk && noteOk && userOk;
    }

    const baseFiles = allFiles.filter(f => matchBaseFilter(f));
    filteredFiles = baseFiles.filter(f => {
        let fileTime = f.created_at || f.updated_at || '';
        let dateOk = true;
        if(dateStart && fileTime){
            const dayStr = fileTime.split('T')[0];
            if(dayStr < dateStart) dateOk = false;
        }
        if(dateEnd && fileTime){
            const dayStr = fileTime.split('T')[0];
            if(dayStr > dateEnd) dateOk = false;
        }
        return dateOk;
    });

    document.getElementById('totalCountText').innerText = `筛选(文件名/备注/上传人)总文件数：${baseFiles.length} 个`;
    if(dateStart || dateEnd){
        document.getElementById('rangeCountText').innerText = `叠加时间(${dateStart||'不限'} ~ ${dateEnd||'不限'})后展示文件数：${filteredFiles.length} 个`;
    }else{
        document.getElementById('rangeCountText').innerText = `时间段内文件数：未选择时间范围`;
    }

    const totalPages = Math.ceil(filteredFiles.length / pageSize) || 1;
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;
    const pageFiles = filteredFiles.slice(start, end);

    let box = document.getElementById("fileBox");
    if(pageFiles.length === 0){
        box.innerHTML = "无匹配文件";
        renderPagination();
        return;
    }

    if(viewType === 'list'){
        let h = "";
        pageFiles.forEach(f => {
            const storeFileName = f.name;
            const meta = getFileMeta(storeFileName);
            const showName = getDisplayFileName(storeFileName);
            const uploadUser = (meta.uploader || "").trim();
            const fileNote = meta.note || "";
            const url = sb.storage.from("files").getPublicUrl(storeFileName).data.publicUrl;
            const size = formatSize(f.metadata?.size);
            const time = formatTime(f.created_at || f.updated_at);

            h += `
            <div class="file-item">
                <input type="checkbox" class="file-chk" value="${storeFileName}" onclick="startUserOperation(); endUserOperation();">
                <div class="file-info">
                    <div>${showName}
                        <button onclick="copySingleFileName('${storeFileName}')" style="padding:2px 6px;font-size:12px;background:#19b500;margin-left:6px;">复制</button>
                        <span style="margin-left:8px;color:#666;font-size:12px;">上传人：${uploadUser}</span>
                    </div>
                    <div class="file-size-text">大小：${size}</div>
                    <div class="file-time-text">上传时间：${time}</div>
                    <div style="margin-top:4px;display:flex;align-items:center;gap:6px;">
                        <input class="note-input" placeholder="填写自定义备注" value="${fileNote}"
                            onblur="saveFileNote('${storeFileName}',this)"
                            onkeydown="if(event.key==='Enter'){ saveFileNote('${storeFileName}',this); this.blur(); }">
                        <button onclick="clearSingleNote('${storeFileName}')" style="padding:2px 6px;font-size:12px;background:#f56c6c;">清空备注</button>
                    </div>
                </div>
                <div>
                    <a href="${url}" target="_blank" class="btn-sm" style="background:#909399">预览</a>
                    <a href="${url}" download="${encodeURIComponent(showName)}" class="btn-sm" style="background:#67c23a;margin:0 4px;">下载</a>
                    <button class="small danger" onclick="delOne('${storeFileName}')">删除</button>
                </div>
            </div>`;
        });
        box.innerHTML = h;
    }else{
        let h = '<div class="file-grid">';
        pageFiles.forEach(f => {
            const storeFileName = f.name;
            const meta = getFileMeta(storeFileName);
            const showName = getDisplayFileName(storeFileName);
            const uploadUser = (meta.uploader || "").trim();
            const fileNote = meta.note || "";
            const url = sb.storage.from("files").getPublicUrl(storeFileName).data.publicUrl;
            const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(storeFileName);
            const size = formatSize(f.metadata?.size);
            const time = formatTime(f.created_at || f.updated_at);

            h += `
            <div class="grid-item">
                <input type="checkbox" class="file-chk" value="${storeFileName}" onclick="startUserOperation(); endUserOperation();">
                ${isImg ? `<img src="${url}">` : `<div style="height:120px;line-height:120px;font-size:40px">📄</div>`}
                <div class="name">${showName}</div>
                <div style="font-size:12px;color:#409eff">上传人：${uploadUser}</div>
                <button onclick="copySingleFileName('${storeFileName}')" style="padding:2px 6px;font-size:12px;background:#19b500;margin-top:4px;">复制纯文件名</button>
                <div style="font-size:12px;color:#666">${size}</div>
                <div style="font-size:11px;color:#999">${time}</div>
                <div style="margin:4px 0;display:flex;align-items:center;gap:4px;justify-content:center;">
                    <input class="note-input" style="width:80px" placeholder="自定义备注" value="${fileNote}"
                        onblur="saveFileNote('${storeFileName}',this)"
                        onkeydown="if(event.key==='Enter'){ saveFileNote('${storeFileName}',this); this.blur(); }">
                    <button onclick="clearSingleNote('${storeFileName}')" style="padding:2px 4px;font-size:11px;background:#f56c6c;">清空</button>
                </div>
                <div style="margin-top:6px;display:flex;gap:4px;justify-content:center;">
                    <a href="${url}" target="_blank" class="btn-sm" style="font-size:11px;background:#909399">预览</a>
                    <a href="${url}" download="${encodeURIComponent(showName)}" class="btn-sm" style="font-size:11px;background:#67c23a">下载</a>
                    <button class="small danger" style="font-size:11px" onclick="delOne('${storeFileName}')">删除</button>
                </div>
            </div>`;
        });
        h += "</div>";
        box.innerHTML = h;
    }
    renderPagination();
}

function startAutoRefresh(){
    if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => { 
        if(currentLoginUser) loadAllFiles(true); 
    }, AUTO_REFRESH_INTERVAL);
}
